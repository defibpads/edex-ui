name: Build packaged binaries

on: [push, pull_request, create]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install system dependencies for x64->x32 cross-build
      run: |
        sudo apt update
        sudo apt install libc6-dev-i386 gcc-multilib g++-multilib
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Setup npm and node-gyp
      run: sudo npm i -g npm@10 node-gyp@latest
    - name: Use modern node-gyp for npm lifecycle scripts
      run: echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
    - name: Reset npm cache and workspace
      run: |
        sudo chown -R "$(id -u):$(id -g)" ~/.npm || true
        npm cache clean --force
        sudo rm -rf node_modules src/node_modules prebuild-src
    - name: Install build deps
      run: npm install
    - name: Run prebuild script
      run: npm run prebuild-linux
    - name: Build for x64 / ia32
      run: ./node_modules/.bin/electron-builder build -l --x64 --ia32
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImages
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Reset npm cache and workspace
      run: |
        sudo chown -R "$(id -u):$(id -g)" ~/.npm || true
        npm cache clean --force
        sudo rm -rf node_modules src/node_modules prebuild-src
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@10 node-gyp@latest && export npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js" && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm32v7 (aka armv7l)
      run: |
        docker run --rm \
          --platform linux/arm/v7 \
          -v "$PWD:/workspace" \
          -v "$HOME/.npm:/root/.npm" \
          -v "$HOME/.cache/electron:/root/.cache/electron" \
          -w /workspace \
          -e GH_TOKEN \
          node:22-bookworm \
          bash -c 'npm i -g npm@10 node-gyp@latest && export npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js" && npm install && ./node_modules/.bin/electron-builder build -l --armv7l' 
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm32-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Reset npm cache and workspace
      run: |
        sudo chown -R "$(id -u):$(id -g)" ~/.npm || true
        npm cache clean --force
        sudo rm -rf node_modules src/node_modules prebuild-src
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@10 node-gyp@latest && export npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js" && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm64 (aka arm64v8)
      run: |
        docker run --rm \
          --platform linux/arm64 \
          -v "$PWD:/workspace" \
          -v "$HOME/.npm:/root/.npm" \
          -v "$HOME/.cache/electron:/root/.cache/electron" \
          -w /workspace \
          -e GH_TOKEN \
          node:22-bookworm \
          bash -c 'npm i -g npm@10 node-gyp@latest && export npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js" && npm install && ./node_modules/.bin/electron-builder build -l --arm64' 
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm64-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Get npm cache directory
      id: npm-cache
      shell: pwsh
      run: |
        "dir=$(npm config get cache)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - uses: actions/cache@v4
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/AppData/Local/electron/Cache
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Python for native modules
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Setup npm and node-gyp
      run: npm i -g npm@10 node-gyp@latest
    - name: Use modern node-gyp for npm lifecycle scripts
      shell: pwsh
      run: |
        $nodeGyp = Join-Path (npm root -g) 'node-gyp/bin/node-gyp.js'
        "npm_config_node_gyp=$nodeGyp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Reset npm cache and workspace
      shell: pwsh
      run: |
        npm cache clean --force
        Remove-Item -Recurse -Force node_modules, src/node_modules, prebuild-src -ErrorAction SilentlyContinue
    - name: npm install
      run: npm install
      env:
        npm_config_build_from_source: 'true'
    - name: npm build
      run: npm run build-windows
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        npm_config_build_from_source: 'true'
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: dist/*.exe
        if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/Library/Caches/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Setup npm and node-gyp
      run: sudo npm i -g npm@10 node-gyp@latest
    - name: Use modern node-gyp for npm lifecycle scripts
      run: echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
    - name: Reset npm cache and workspace
      run: |
        sudo chown -R "$(id -u):$(id -g)" ~/.npm || true
        npm cache clean --force
        sudo rm -rf node_modules src/node_modules prebuild-src
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-darwin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: MacOS-Image
        path: dist/*.dmg
        if-no-files-found: error
