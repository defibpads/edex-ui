name: Health Check

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  metadata:
    name: Metadata and audit checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reset npm cache and workspace
        run: |
          sudo chown -R "$(id -u):$(id -g)" ~/.npm || true
          npm cache clean --force
          sudo rm -rf node_modules src/node_modules prebuild-src

      - name: Install root dependencies without native rebuilds
        run: npm ci --ignore-scripts

      - name: Validate package metadata
        run: npm run check:metadata

      - name: Report native build environment
        run: npm run doctor:native

      - name: Audit root build dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Audit packaged app dependencies
        continue-on-error: true
        run: npm --prefix src audit --audit-level=high
